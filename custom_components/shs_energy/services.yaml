profile_resources:
  name: Profile integration resources
  description: >-
    Return bounded CPU timing, memory, retained-history and queue diagnostics.
    Administrator access is required. Optionally start a timed process-wide Python
    allocation capture. Tracing adds overhead and is off by default. Call again
    without allocation_seconds to read the result after the capture finishes.
    Existing tracing owned by another profiler is never replaced.
  fields:
    entry_id:
      name: Configuration entry ID
      description: Required only when more than one SHS Energy entry exists.
      selector:
        text:
    allocation_seconds:
      name: Allocation capture duration
      description: Zero reads diagnostics only; 1–300 starts an allocation capture.
      default: 0
      selector:
        number:
          min: 0
          max: 300
          unit_of_measurement: seconds
          mode: box
  response:
    optional: false

discover_configuration:
  name: Discover energy configuration
  description: >-
    Read the curated Home Assistant Energy Dashboard and return recommended
    aggregate meters, forecasts and supported planning capabilities. Nothing is
    changed.
  fields:
    entry_id:
      name: Configuration entry ID
      description: Required only when more than one SHS Energy entry exists.
      example: 01JEXAMPLE
      selector:
        text:
  response:
    optional: false

backfill_prices:
  name: Backfill electricity prices
  description: >-
    Reprice a past window and send it to the SHS portal, which stores no
    historical price of its own. Supplier prices are fetched for the requested
    dates and combined with the effective-dated grid tariff, so each quarter
    gets the same all-in figure the planner optimises against rather than an
    estimate. Existing quarters are overwritten, so re-running is safe.
  fields:
    entry_id:
      name: Configuration entry ID
      description: Required only when more than one SHS Energy entry exists.
      example: 01JEXAMPLE
      selector:
        text:
    days:
      name: Days
      description: >-
        How many days back from the start of today to reprice. The portal keeps
        measured quarters for 120 days, so pricing further back has nothing to
        attach to.
      required: true
      example: 7
      default: 7
      selector:
        number:
          min: 1
          max: 120
          mode: box
          unit_of_measurement: days
  response:
    optional: false

apply_configuration:
  name: Apply energy configuration
  description: >-
    Validate and save an explicit configuration supplied by an administrator
    or MCP client. Discovery is a separate read-only action and is never
    silently re-run while applying. Website-selected devices with complete
    local mappings enter the advisory plan automatically. EV current bounds
    are saved in the Variable Power device card; three 230 V phases are an
    integration invariant. Home Assistant's internal .storage files are never
    edited directly. Controllable-device mappings are saved independently from
    their cards on the SHS Energy configuration page.
  fields:
    entry_id:
      name: Configuration entry ID
      description: Required only when more than one SHS Energy entry exists.
      example: 01JEXAMPLE
      selector:
        text:
    configuration:
      name: Configuration
      description: Mapping of supported SHS Energy option keys to values.
      required: true
      example:
        automatic_setup: true
      selector:
        object:
  response:
    optional: true
