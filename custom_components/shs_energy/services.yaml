discover_configuration:
  name: Discover energy configuration
  description: >-
    Read the curated Home Assistant Energy Dashboard and return recommended
    aggregate meters, forecasts and supported planning capabilities. Nothing is
    changed.
  fields:
    entry_id:
      name: Configuration entry ID
      description: Required only when more than one SHS Energy entry exists.
      example: 01JEXAMPLE
      selector:
        text:
  response:
    optional: false

backfill_prices:
  name: Backfill electricity prices
  description: >-
    Reprice a past window and send it to the SHS portal, which stores no
    historical price of its own. Supplier prices are fetched for the requested
    dates and combined with the effective-dated grid tariff, so each quarter
    gets the same all-in figure the planner optimises against rather than an
    estimate. Existing quarters are overwritten, so re-running is safe.
  fields:
    entry_id:
      name: Configuration entry ID
      description: Required only when more than one SHS Energy entry exists.
      example: 01JEXAMPLE
      selector:
        text:
    days:
      name: Days
      description: >-
        How many days back from the start of today to reprice. The portal keeps
        measured quarters for 120 days, so pricing further back has nothing to
        attach to.
      required: true
      example: 7
      default: 7
      selector:
        number:
          min: 1
          max: 120
          mode: box
          unit_of_measurement: days
  response:
    optional: false

apply_configuration:
  name: Apply energy configuration
  description: >-
    Validate and save an explicit configuration supplied by an administrator
    or MCP client. Discovery is a separate read-only action and is never
    silently re-run while applying. Every enabled flexible load must include
    its explicit deferrability confirmation, and EV control must also confirm
    phase count and voltage. Home Assistant's internal .storage files are never
    edited directly.
  fields:
    entry_id:
      name: Configuration entry ID
      description: Required only when more than one SHS Energy entry exists.
      example: 01JEXAMPLE
      selector:
        text:
    configuration:
      name: Configuration
      description: Mapping of supported SHS Energy option keys to values.
      required: true
      example:
        planning_mode: live
        automatic_setup: true
      selector:
        object:
  response:
    optional: true
