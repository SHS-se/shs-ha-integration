name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    name: Test, summarize, and publish
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Require the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [[ "$GITHUB_REF_NAME" != "$DEFAULT_BRANCH" ]]; then
            echo "::error title=Wrong branch::Run this workflow from $DEFAULT_BRANCH."
            exit 1
          fi

      - name: Check out the repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Run integration checks
        run: |
          python -m unittest discover -s tests -v
          python -m compileall -q custom_components/shs_energy

      - name: Read and validate the release version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current="$(python -c 'import json; print(json.load(open("custom_components/shs_energy/manifest.json", encoding="utf-8"))["version"])')"

          # This workflow only ever publishes stable versions, so any beta
          # suffix left behind by the Beta workflow is dropped: 0.4.0-beta.3
          # releases as 0.4.0. Cutting the next series is a manifest bump.
          version="${current%%-*}"

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error title=Invalid version::$current has no usable X.Y.Z base."
            exit 1
          fi

          if git show-ref --verify --quiet "refs/tags/$version"; then
            echo "::error title=Tag exists::Tag $version already exists."
            exit 1
          fi

          if gh release view "$version" >/dev/null 2>&1; then
            echo "::error title=Release exists::Release $version already exists."
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "changed=$([[ "$current" == "$version" ]] && echo false || echo true)" >> "$GITHUB_OUTPUT"

      - name: Require Copilot access
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          if [[ -z "$RELEASE_TOKEN" ]]; then
            echo "::error title=Missing secret::Add a RELEASE_TOKEN repository secret with Copilot Requests permission."
            exit 1
          fi

      - name: Build release context
        id: context
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          previous_tag="$(gh release list --exclude-drafts --exclude-pre-releases --limit 1 --json tagName --jq '.[0].tagName // ""')"

          if [[ -n "$previous_tag" ]]; then
            git rev-parse --verify "refs/tags/$previous_tag^{commit}" >/dev/null
            diff_base="$previous_tag"
            changelog_url="https://github.com/$GITHUB_REPOSITORY/compare/$previous_tag...$VERSION"
          else
            diff_base="$(git hash-object -t tree /dev/null)"
            changelog_url="https://github.com/$GITHUB_REPOSITORY/commits/$VERSION"
          fi

          {
            echo "Release version: $VERSION"
            echo "Previous published release: ${previous_tag:-none}"
            echo
            echo "Commit history:"
            if [[ -n "$previous_tag" ]]; then
              git log --reverse --format='- %s%n%b' "$previous_tag..HEAD"
            else
              git log --reverse --format='- %s%n%b' HEAD
            fi
            echo
            echo "Changed files:"
            git diff --stat "$diff_base" HEAD
            echo
            echo "Code diff:"
            git diff --unified=2 "$diff_base" HEAD
          } > release-context.txt

          echo "changelog_url=$changelog_url" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install GitHub Copilot CLI
        run: npm install --global @github/copilot

      - name: Build Copilot prompt
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          {
            cat .github/prompts/release-notes.txt
            printf '\n\nRelease version: %s\n\n<release-context>\n' "$VERSION"
            cat release-context.txt
            printf '\n</release-context>\n'
          } > copilot-prompt.txt

      - name: Generate release notes
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          copilot -p "$(cat copilot-prompt.txt)" \
            -s \
            --no-ask-user \
            --no-custom-instructions \
            > release-notes.generated.md

      - name: Prepare release notes
        env:
          CHANGELOG_URL: ${{ steps.context.outputs.changelog_url }}
          RESPONSE_FILE: release-notes.generated.md
        run: |
          if [[ ! -s "$RESPONSE_FILE" ]]; then
            echo "::error title=Empty release notes::Copilot returned no release notes."
            exit 1
          fi

          cp "$RESPONSE_FILE" release-notes.md
          printf '\n\n**Full Changelog**: %s\n' "$CHANGELOG_URL" >> release-notes.md
          cat release-notes.md >> "$GITHUB_STEP_SUMMARY"

      - name: Drop the beta suffix from the manifest
        id: commit
        if: steps.version.outputs.changed == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python - <<'PY'
          import json
          import os
          import re

          path = "custom_components/shs_energy/manifest.json"
          version = os.environ["VERSION"]
          with open(path, encoding="utf-8") as handle:
              text = handle.read()
          updated, count = re.subn(
              r'("version":\s*)"[^"]*"', rf'\1"{version}"', text, count=1
          )
          if count != 1:
              raise SystemExit(f"could not find a version field in {path}")
          with open(path, "w", encoding="utf-8") as handle:
              handle.write(updated)
          json.loads(updated)
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/shs_energy/manifest.json
          git commit -m "Release $VERSION"
          git push origin "HEAD:$GITHUB_REF_NAME"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          TARGET: ${{ steps.commit.outputs.sha || github.sha }}
        run: |
          # No --fail-on-no-commits: promoting a tested beta to its stable
          # version need not add commits, and that is the normal path.
          gh release create "$VERSION" \
            --target "$TARGET" \
            --title "$VERSION" \
            --notes-file release-notes.md \
            --latest
