name: Beta

on:
  push:
    branches:
      - main
    # Documentation cannot change what gets installed, so it does not earn a
    # build. Any push that also touches code still publishes one.
    paths-ignore:
      - "**.md"
  workflow_dispatch:

permissions:
  contents: write

# Shares the Release group so a beta and a stable release can never race for
# the same tag namespace.
concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  beta:
    name: Test and publish a beta
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The Release workflow pushes its own "Release <version>" commit. Pushes
    # made with GITHUB_TOKEN do not start new workflow runs, but this guard
    # means a future switch to a PAT still cannot create a publish loop.
    if: ${{ !startsWith(github.event.head_commit.message, 'Release ') }}

    steps:
      - name: Require the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [[ "$GITHUB_REF_NAME" != "$DEFAULT_BRANCH" ]]; then
            echo "::error title=Wrong branch::Run this workflow from $DEFAULT_BRANCH."
            exit 1
          fi

      - name: Check out the repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Run integration checks
        run: |
          python -m unittest discover -s tests -v
          python -m compileall -q custom_components/shs_energy

      - name: Read and validate the beta version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          manifest="custom_components/shs_energy/manifest.json"
          version="$(python -c "import json; print(json.load(open('$manifest', encoding='utf-8'))['version'])")"

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-[0-9A-Za-z.-]+$ ]]; then
            echo "::error title=Not a beta version::$version is not a pre-release. Betas need a suffix such as 0.4.0-beta.4; a bare version is published by the Release workflow."
            exit 1
          fi

          # The workflow never writes the manifest: the version belongs to the
          # commit that changed the code, so it is bumped locally alongside it.
          # An existing tag therefore means the bump was forgotten.
          if git show-ref --verify --quiet "refs/tags/$version" \
            || gh release view "$version" >/dev/null 2>&1; then
            echo "::error title=Version not bumped::$version is already published. Bump the version in $manifest (scripts/bump.sh beta) and push again."
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Publishing pre-release $version." >> "$GITHUB_STEP_SUMMARY"

      - name: Publish the pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Betas use GitHub's generated notes: they are throwaway builds, and
          # this keeps them independent of the Copilot secret the stable
          # release depends on.
          gh release create "$VERSION" \
            --target "$GITHUB_SHA" \
            --title "$VERSION" \
            --generate-notes \
            --prerelease
